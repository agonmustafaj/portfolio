    .glow {
      position: absolute;
      top: 10%;

      width: 42%;
      height: 70%;
      background: radial-gradient(ellipse, rgba(30, 74, 140, 0.28) 0%, transparent 68%);
      pointer-events: none;
    }

    .glow-band {
      position: absolute;
      left: 50%;
      top: 72%;
      width: 86%;
      height: 34%;
      transform: translate(-50%, -50%);
      background: radial-gradient(ellipse, rgba(36, 86, 160, 0.42) 0%, transparent 68%);
      pointer-events: none;
    }
