<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="robots" content="noindex">
  <title>AGON MUSTAFAJ - OG</title>
  <style>
    @font-face {
      font-family: "Satoshi";
      src: url("fonts/satoshi-700.woff2") format("woff2");
      font-weight: 700;
      font-style: normal;
    }
    @font-face {
      font-family: "Satoshi";
      src: url("fonts/satoshi-900.woff2") format("woff2");
      font-weight: 900;
      font-style: normal;
    }
    @font-face {
      font-family: "Manrope";
      src: url("fonts/manrope.woff2") format("woff2");
      font-weight: 500 600;
      font-style: normal;
    }
    @font-face {
      font-family: "JetBrains Mono";
      src: url("fonts/jetbrains-mono-500.woff2") format("woff2");
      font-weight: 500;
      font-style: normal;
    }

    * { box-sizing: border-box; margin: 0; padding: 0; }

    html, body {
      width: 1200px;
      height: 630px;
      overflow: hidden;
      background: #080B14;
    }

    .og {
      width: 1200px;
      height: 630px;
      position: relative;
      background:
        radial-gradient(ellipse 70% 55% at 12% -8%, rgba(85, 119, 255, 0.18), transparent 55%),
        radial-gradient(ellipse 55% 45% at 88% 8%, rgba(155, 109, 255, 0.14), transparent 50%),
        radial-gradient(ellipse 40% 35% at 72% 88%, rgba(73, 217, 255, 0.08), transparent 55%),
        #080B14;
      color: #F5F7FF;
      overflow: hidden;
      -webkit-font-smoothing: antialiased;
    }

    .vguide {
      position: absolute;
      top: 36px;
      bottom: 36px;
      width: 1px;
      background: rgba(245, 247, 255, 0.08);
      z-index: 2;
      pointer-events: none;
    }
    .vguide.l { left: 48px; }
    .vguide.m { left: 688px; }

    .hguide {
      position: absolute;
      left: 48px;
      right: 48px;
      height: 1px;
      background: rgba(245, 247, 255, 0.07);
      z-index: 2;
      pointer-events: none;
    }
    .hguide.t { top: 36px; }
    .hguide.b { bottom: 36px; }

    .mark {
      position: absolute;
      width: 14px;
      height: 14px;
      z-index: 8;
    }
    .mark::before,
    .mark::after {
      content: "";
      position: absolute;
      background: rgba(245, 247, 255, 0.42);
    }
    .mark::before { width: 14px; height: 1px; top: 7px; left: 0; }
    .mark::after { width: 1px; height: 14px; top: 0; left: 7px; }
    .mark.tl { top: 18px; left: 18px; }
    .mark.tr { top: 18px; right: 18px; }
    .mark.bl { bottom: 18px; left: 18px; }
    .mark.br { bottom: 18px; right: 18px; }

    .ghost {
      position: absolute;
      right: -48px;
      bottom: -52px;
      z-index: 1;
      font-family: "Satoshi", sans-serif;
      font-weight: 900;
      font-size: 280px;
      line-height: 0.8;
      letter-spacing: -0.07em;
      color: rgba(245, 247, 255, 0.04);
      text-transform: uppercase;
      pointer-events: none;
      user-select: none;
    }

    .portrait {
      position: absolute;
      right: 0;
      top: 0;
      width: 520px;
      height: 630px;
      z-index: 1;
      overflow: hidden;
    }
    .portrait img {
      width: 100%;
      height: 100%;
      object-fit: cover;
      object-position: 50% 38%;
      transform: scale(1.18);
      transform-origin: 50% 36%;
      filter: contrast(1.1) brightness(1.06) saturate(1.15);
    }
    .portrait::after {
      content: "";
      position: absolute;
      inset: 0;
      background:
        linear-gradient(90deg, #080B14 0%, rgba(8,11,20,0.92) 14%, rgba(8,11,20,0.35) 42%, transparent 66%),
        linear-gradient(180deg, #080B14 0%, transparent 16%),
        linear-gradient(0deg, #080B14 0%, rgba(8,11,20,0.88) 8%, rgba(8,11,20,0.28) 26%, transparent 46%);
    }
    .portrait .frame {
      position: absolute;
      top: 48px;
      right: 48px;
      bottom: 48px;
      width: 1px;
      background: rgba(245, 247, 255, 0.1);
      z-index: 2;
    }
    .portrait .accent {
      position: absolute;
      top: 48px;
      right: 48px;
      width: 36px;
      height: 2px;
      background: linear-gradient(90deg, #5577FF 0%, #9B6DFF 55%, #49D9FF 100%);
      z-index: 3;
    }

    .top {
      position: absolute;
      top: 52px;
      left: 56px;
      width: 620px;
      z-index: 6;
      display: flex;
      align-items: center;
      justify-content: space-between;
      font-family: "Manrope", sans-serif;
      font-weight: 600;
      font-size: 11px;
      letter-spacing: 0.22em;
      text-transform: uppercase;
      color: rgba(245, 247, 255, 0.55);
    }
    .top .rule {
      position: absolute;
      left: 0;
      right: 0;
      top: -16px;
      height: 1px;
      background: rgba(245, 247, 255, 0.16);
    }
    .top .num {
      color: #5577FF;
      letter-spacing: 0.18em;
    }

    .headline {
      position: absolute;
      left: 56px;
      top: 96px;
      z-index: 6;
      width: 640px;
      font-family: "Satoshi", sans-serif;
      font-weight: 900;
      text-transform: uppercase;
      line-height: 0.84;
      letter-spacing: -0.054em;
      color: #F5F7FF;
    }
    .headline .name {
      font-size: 102px;
    }

    .dek {
      position: absolute;
      left: 56px;
      top: 328px;
      z-index: 6;
      width: 460px;
      font-family: "Manrope", sans-serif;
      font-weight: 500;
      font-size: 16px;
      line-height: 1.4;
      letter-spacing: 0.01em;
      color: rgba(146, 157, 179, 0.95);
    }

    .agodev {
      position: absolute;
      left: 56px;
      top: 368px;
      width: 600px;
      height: 144px;
      z-index: 6;
      display: flex;
      align-items: center;
      font-family: "JetBrains Mono", ui-monospace, monospace;
      font-weight: 500;
      font-size: 72px;
      letter-spacing: -0.05em;
      line-height: 0.95;
      color: #F5F7FF;
    }
    .agodev span {
      background: linear-gradient(135deg, #5577FF 0%, #9B6DFF 50%, #49D9FF 100%);
      -webkit-background-clip: text;
      background-clip: text;
      color: transparent;
    }

    .bottom {
      position: absolute;
      left: 56px;
      width: 620px;
      bottom: 44px;
      z-index: 6;
    }
    .bottom .rule {
      height: 1px;
      background: rgba(245, 247, 255, 0.16);
      margin-bottom: 18px;
    }
    .bottom-row {
      display: flex;
      justify-content: space-between;
      align-items: flex-end;
    }
    .cta {
      font-family: "Manrope", sans-serif;
      font-weight: 600;
      font-size: 15px;
      letter-spacing: 0.06em;
      color: #F5F7FF;
    }
    .url {
      margin-top: 6px;
      font-family: "Manrope", sans-serif;
      font-weight: 500;
      font-size: 14px;
      letter-spacing: 0.16em;
      color: rgba(146, 157, 179, 0.85);
    }
    .seq {
      font-family: "Manrope", sans-serif;
      font-weight: 600;
      font-size: 11px;
      letter-spacing: 0.2em;
      color: rgba(102, 115, 139, 0.9);
      padding-bottom: 2px;
    }
    .seq .on { color: #49D9FF; }

    .lockup {
      position: absolute;
      right: 58px;
      bottom: 44px;
      z-index: 7;
      width: 188px;
      display: flex;
      flex-direction: column;
      align-items: center;
      gap: 8px;
    }
    .lockup img {
      width: 132px;
      height: auto;
      display: block;
    }
    .lockup-name {
      font-family: "Satoshi", sans-serif;
      font-weight: 700;
      font-size: 11px;
      letter-spacing: 0.16em;
      text-transform: uppercase;
      color: #F5F7FF;
      line-height: 1;
      white-space: nowrap;
    }
  </style>
</head>
<body>
  <div class="og">
    <div class="vguide l"></div>
    <div class="vguide m"></div>
    <div class="hguide t"></div>
    <div class="hguide b"></div>
    <div class="mark tl"></div>
    <div class="mark tr"></div>
    <div class="mark bl"></div>
    <div class="mark br"></div>

    <div class="ghost">01</div>

    <div class="portrait">
      <img src="../images/agon-ai-nerve.png" alt="Agon Mustafaj">
      <span class="frame"></span>
      <span class="accent"></span>
    </div>

    <header class="top">
      <span class="rule"></span>
      <span>Agon Mustafaj</span>
      <span class="num">01</span>
    </header>

    <h1 class="headline">
      <div class="name">AGON</div>
      <div class="name">MUSTAFAJ</div>
    </h1>

    <p class="dek">Explore the work, experience &amp; ideas behind Agon Mustafaj.</p>

    <p class="agodev">Ago<span>Dev</span></p>

    <div class="lockup">
      <img src="logo-mark.png" alt="">
      <div class="lockup-name">Agon Mustafaj</div>
    </div>

    <footer class="bottom">
      <div class="rule"></div>
      <div class="bottom-row">
        <div>
          <div class="cta">Explore the work →</div>
          <div class="url">agonmustafaj.com</div>
        </div>
        <div class="seq"><span class="on">01</span> / 02 / 03</div>
      </div>
    </footer>
  </div>
</body>
</html>
