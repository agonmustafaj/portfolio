<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <title>AGON MUSTAFAJ - LinkedIn banner</title>
  <style>
    @font-face {
      font-family: "Satoshi";
      src: url("fonts/satoshi-700.woff2") format("woff2");
      font-weight: 700;
      font-style: normal;
    }
    @font-face {
      font-family: "Satoshi";
      src: url("fonts/satoshi-900.woff2") format("woff2");
      font-weight: 900;
      font-style: normal;
    }
    @font-face {
      font-family: "Manrope";
      src: url("fonts/manrope.woff2") format("woff2");
      font-weight: 500 600;
      font-style: normal;
    }

    * { box-sizing: border-box; margin: 0; padding: 0; }

    html, body {
      width: 1584px;
      height: 396px;
      overflow: hidden;
      background: #0a0a0b;
    }

    .banner {
      width: 1584px;
      height: 396px;
      position: relative;
      background: #0a0a0b;
      color: #f3efe6;
      overflow: hidden;
    }

    .vguide, .hguide {
      position: absolute;
      background: rgba(243, 239, 230, 0.08);
      pointer-events: none;
      z-index: 2;
    }
    .vguide { top: 22px; bottom: 22px; width: 1px; }
    .vguide.l { left: 28px; }
    .vguide.m { left: 1088px; }
    .hguide { left: 28px; right: 28px; height: 1px; }
    .hguide.t { top: 22px; }
    .hguide.b { bottom: 22px; }

    .mark {
      position: absolute;
      width: 12px;
      height: 12px;
      z-index: 8;
    }
    .mark::before, .mark::after {
      content: "";
      position: absolute;
      background: rgba(243, 239, 230, 0.4);
    }
    .mark::before { width: 12px; height: 1px; top: 6px; left: 0; }
    .mark::after { width: 1px; height: 12px; top: 0; left: 6px; }
    .mark.tl { top: 12px; left: 12px; }
    .mark.tr { top: 12px; right: 12px; }
    .mark.bl { bottom: 12px; left: 12px; }
    .mark.br { bottom: 12px; right: 12px; }

    .top {
      position: absolute;
      top: 36px;
      left: 48px;
      width: 1000px;
      z-index: 6;
      display: flex;
      justify-content: space-between;
      font-family: "Manrope", sans-serif;
      font-weight: 600;
      font-size: 12px;
      letter-spacing: 0.22em;
      text-transform: uppercase;
      color: rgba(243, 239, 230, 0.55);
    }
    .top .num { color: #2b59ff; letter-spacing: 0.18em; }

    .headline {
      position: absolute;
      left: 48px;
      top: 118px;
      z-index: 6;
      font-family: "Satoshi", sans-serif;
      font-weight: 900;
      font-size: 78px;
      line-height: 0.9;
      letter-spacing: -0.045em;
      text-transform: uppercase;
    }

    .roles {
      position: absolute;
      top: 168px;
      right: 536px;
      z-index: 6;
      width: 430px;
      text-align: right;
      font-family: "Manrope", sans-serif;
      font-weight: 500;
      font-size: 20px;
      line-height: 1.45;
      letter-spacing: 0.01em;
      color: rgba(243, 239, 230, 0.72);
    }

    .bottom {
      position: absolute;
      left: 48px;
      bottom: 32px;
      width: 1000px;
      z-index: 6;
      display: flex;
      justify-content: space-between;
      align-items: flex-end;
      font-family: "Manrope", sans-serif;
    }
    .url {
      font-weight: 500;
      font-size: 15px;
      letter-spacing: 0.16em;
      color: rgba(243, 239, 230, 0.48);
    }
    .seq {
      font-weight: 600;
      font-size: 12px;
      letter-spacing: 0.2em;
      color: rgba(243, 239, 230, 0.32);
    }
    .seq .on { color: #2b59ff; }

    .logo-panel {
      position: absolute;
      top: 0;
      right: 0;
      width: 496px;
      height: 396px;
      z-index: 4;
      display: flex;
      align-items: center;
      justify-content: center;
    }
    .logo-panel svg { width: 340px; height: auto; display: block; }
    .accent {
      position: absolute;
      top: 36px;
      right: 48px;
      width: 36px;
      height: 2px;
      background: #2b59ff;
      z-index: 5;
    }
  </style>
</head>
<body>
  <div class="banner">
    <div class="vguide l"></div>
    <div class="vguide m"></div>
    <div class="hguide t"></div>
    <div class="hguide b"></div>
    <div class="mark tl"></div>
    <div class="mark tr"></div>
    <div class="mark bl"></div>
    <div class="mark br"></div>

    <header class="top">
      <span>Agon Mustafaj</span>
      <span class="num">01</span>
    </header>

    <h1 class="headline">Agon Mustafaj</h1>

    <p class="roles">Computer Science student<br>Web development · SEO · AI</p>

    <footer class="bottom">
      <div class="url">agonmustafaj.com</div>
      <div class="seq"><span class="on">01</span> / 02 / 03</div>
